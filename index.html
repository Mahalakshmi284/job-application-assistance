<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elevora AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1>Elevora AI</h1>
      <p>Your beginner-friendly job assistance AI</p>
    </header>

    <!-- Chat History -->
    <main id="chat"></main>

    <!-- Fixed Input -->
    <footer class="input-bar">
      <input
        type="text"
        id="userInput"
        placeholder="Ask Elevora anything…"
      />
      <button id="sendBtn">Send</button>
    </footer>

  </div>

  <script src="script.js"></script>
</body>


</html>
